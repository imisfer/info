<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}" dir="{{ page.txt_dir | default: site.txt_dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- feed_meta -%}
</head>
<body>
  <a class="skip" href="#main">تخطَّ إلى المحتوى</a>

  <header class="masthead">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/blog/' | relative_url }}">{{ site.txt_posts }}</a>
      <a href="{{ '/about/' | relative_url }}">{{ site.txt_about }}</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="colophon">
    <p>{{ site.title }} — {{ 'now' | date: '%Y' }}</p>
    <p><a href="{{ '/feed.xml' | relative_url }}">تدفق RSS</a></p>
  </footer>
</body>
</html>
